name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ meteorite-app ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Decode keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV; fi

      - name: Build signed release (AAB + APK)
        if: env.KEYSTORE_FILE != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease :app:assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeteoriteAtlas-debug.apk
          FILES="MeteoriteAtlas-debug.apk"
          if [ -n "$KEYSTORE_FILE" ]; then
            cp app/build/outputs/apk/release/app-release.apk MeteoriteAtlas.apk
            cp app/build/outputs/bundle/release/app-release.aab MeteoriteAtlas.aab
            FILES="MeteoriteAtlas.apk MeteoriteAtlas.aab MeteoriteAtlas-debug.apk"
          else
            cp MeteoriteAtlas-debug.apk MeteoriteAtlas.apk
            FILES="MeteoriteAtlas.apk"
          fi
          gh release create "meteorite-apk-${{ github.run_number }}" $FILES \
            --target "${{ github.sha }}" --title "Meteorite Atlas APK #${{ github.run_number }}" \
            --notes "Install APK on Android. AAB (if present) is for Google Play."
