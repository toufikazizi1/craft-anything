name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ meteorite-app ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeteoriteAtlas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeteoriteAtlas.apk
          gh release create "meteorite-apk-${{ github.run_number }}" MeteoriteAtlas.apk \
            --target "${{ github.sha }}" --title "Meteorite Atlas APK #${{ github.run_number }}" \
            --notes "Debug APK. Install on Android (allow unknown sources)."
