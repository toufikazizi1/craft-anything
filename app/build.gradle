plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android { namespace 'com.meteoriteatlas'; compileSdk 36
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 signingConfigs {
  release {
   def ks = System.getenv("KEYSTORE_FILE")
   if (ks != null && new File(ks).exists()) {
    storeFile file(ks); storePassword System.getenv("KEYSTORE_PASSWORD"); keyAlias "upload"; keyPassword System.getenv("KEYSTORE_PASSWORD")
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled true
   shrinkResources true
   proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
   if (System.getenv("KEYSTORE_FILE") != null) signingConfig signingConfigs.release
  }
 }
 defaultConfig { applicationId 'com.meteoriteatlas'; minSdk 23; targetSdk 36; versionCode 15; versionName '1.14' }
}
dependencies {
 implementation 'org.osmdroid:osmdroid-android:6.1.20'
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'androidx.work:work-runtime:2.9.1'
}
